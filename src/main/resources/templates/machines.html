```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Machines</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, .add-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Machine Management</h1>

    <div class="top-bar">

        <form action="/machines" method="get" class="search-box">
            <input
                type="text"
                name="search"
                th:value="${search}"
                placeholder="Search machine name">

            <button type="submit">Search</button>
        </form>

        <a href="/machines/add" class="add-btn">
            + Add Machine
        </a>

    </div>

    <table th:if="${not #lists.isEmpty(machines)}">

        <thead>
        <tr>
            <th>ID</th>
            <th>Machine Code</th>
            <th>Machine Name</th>
            <th>Machine Type</th>
            <th>Location</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="machine : ${machines}">

            <td th:text="${machine.id}"></td>

            <td th:text="${machine.machineCode}"></td>

            <td th:text="${machine.machineName}"></td>

            <td th:text="${machine.machineType}"></td>

            <td th:text="${machine.location}"></td>

            <td th:text="${machine.status}"></td>

        </tr>

        </tbody>

    </table>

    <div class="empty" th:if="${#lists.isEmpty(machines)}">
        No machines found.
    </div>

</div>

</body>
</html>
