
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Maintenance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, .add-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .edit-btn {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .edit-btn:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Maintenance Management</h1>

    <div class="top-bar">

        <!-- Search -->
        <form action="/maintenance"
              method="get"
              class="search-box">

            <input
                    type="text"
                    name="search"
                    th:value="${search}"
                    placeholder="Search maintenance">

            <button type="submit">
                Search
            </button>

        </form>


        <!-- Add Maintenance -->
        <a href="/maintenance/add"
           class="add-btn">

            + Add Maintenance

        </a>

    </div>


    <!-- Maintenance Table -->

    <table th:if="${not #lists.isEmpty(maintenanceList)}">

        <thead>

        <tr>
            <th>ID</th>
            <th>Machine ID</th>
            <th>Description</th>
            <th>Assigned To</th>
            <th>Status</th>
            <th>Created Date</th>
            <th>Updated Date</th>
            <th>Action</th>
        </tr>

        </thead>


        <tbody>

        <tr th:each="maintenance : ${maintenanceList}">

            <td th:text="${maintenance.id}"></td>

            <td th:text="${maintenance.machineId}"></td>

            <td th:text="${maintenance.description}"></td>

            <td th:text="${maintenance.assignedTo}"></td>

            <td th:text="${maintenance.status}"></td>

            <td th:text="${maintenance.createdDate}"></td>

            <td th:text="${maintenance.updatedDate}"></td>


            <!-- Edit Button -->

            <td>
                <a
                    th:href="@{/maintenance/edit/{id}(id=${maintenance.id})}"
                    class="edit-btn">

                    Edit

                </a>
            </td>

        </tr>

        </tbody>

    </table>


    <!-- No Maintenance Records -->

    <div
        class="empty"
        th:if="${#lists.isEmpty(maintenanceList)}">

        No maintenance records found.

    </div>

</div>

</body>

</html>
